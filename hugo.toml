baseURL = "https://fwqabc.com/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "fwqabc 出海ABC"
theme = "PaperMod"
enableRobotsTXT = true
pagination.pagerSize = 10

[taxonomies]
  tag = "tags"
  merchant = "merchants"
  route = "routes"
  datacenter = "datacenters"

[permalinks]
  [permalinks.page]
    deals = "/deals/:contentbasename/"
    review = "/review/:contentbasename/"
    guides = "/guides/:contentbasename/"
    tutorials = "/tutorials/:contentbasename/"
    tools = "/tools/:contentbasename/"
    free = "/free/:contentbasename/"

[params]
  env = "production"
  homeTitle = "把出海该花的钱、该办的事讲明白"
  serverSlogan = "出海服务器，少踩坑少花钱"  # 仅用于服务器板块，不是整个品牌口号
  brandLine = "出海ABC，免费帮中国出海的中小企业、个体户、源头工厂和原厂，把出海该花的钱、该办的事讲明白，少花钱、少踩坑。"
  description = "出海ABC 说明中国企业出海要花的钱、要办的事，并整理国外服务器的价格、线路和优惠。价格以官网为准；部分链接含推广佣金。"
  tagline = "少花钱、少踩坑"
  images = ["/brand/og-default-1200x630.jpg"]
  keywords = ["国外VPS", "VPS优惠", "外贸建站服务器", "出海服务器", "CN2 GIA", "双11 VPS"]
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowToc = true
  ShowPostNavLinks = true
  xHandle = "chuhaiABC"  # X 账号（不带 @）；留空则不显示
  telegram = ""      # Telegram 频道链接，如 https://t.me/fwqabc；留空则不显示订阅框
  umami = ""          # Umami 统计脚本地址，如 https://analytics.example.com/script.js；留空=不启用
  umamiWebsiteId = ""
  double11 = "2026-11-11T00:00:00+08:00"
  blackFridayStart = "2026-11-25T00:00:00+08:00"
  blackFridayEnd = "2026-11-30T23:59:59+08:00"

  DateFormat = "2006年1月2日"
  contactEmail = "chuhaiABC@outlook.com"  # 纠错/合作邮箱
  lastUpdated = ""    # 可选：首页“最近更新”日期覆盖；留空则取全站最新文章的 lastmod

  author = "出海ABC"

  [params.schema]
    publisherType = "Organization"
    sameAs = ["https://x.com/chuhaiABC"]

  [params.label]
    text = "出海ABC"
    icon = "/brand/logo-64.png"
    iconHeight = 32
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-32x32.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/android-chrome-512x512.png"
    theme_color = "#F24615"
  [params.footer]
    text = "部分链接含推广佣金，会标明，不让你多付钱，也不换结论，详见 [推广披露](/disclosure/)。价格以官网为准。"

[menus]
  [[menus.main]]
    name = "优惠促销"
    url = "/deals/"
    weight = 10
  [[menus.main]]
    name = "免费服务器 / 赠金"
    url = "/free/"
    weight = 15
  [[menus.main]]
    name = "线路专题"
    url = "/routes/"
    weight = 30
  [[menus.main]]
    name = "商家目录"
    url = "/merchants/"
    weight = 50

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", "date"]
  date = ["date", "publishDate"]

[sitemap]
  changeFreq = "daily"

[markup.goldmark.renderer]
  unsafe = false
