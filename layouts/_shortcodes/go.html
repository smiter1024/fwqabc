{{- $slug := .Get 0 -}}{{- $text := .Get 1 | default (i18n "ctaPromo") -}}
{{- if not (index hugo.Data.links $slug) }}{{ errorf "go shortcode: unknown slug %q in %s" $slug .Position }}{{ end -}}
<span class="cta-pair"><a class="go-btn" href="/go/{{ $slug }}/" rel="sponsored nofollow noopener" target="_blank" aria-label="{{ i18n "ctaPromo" }}：{{ $text }}（{{ i18n "affTag" }}）">{{ i18n "ctaPromo" }}</a><small class="aff-tag">{{ i18n "affTag" }}</small></span>
